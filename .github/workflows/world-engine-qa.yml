name: World Engine QA

on:
  pull_request:
    paths:
      - 'world/**'
      - 'tests/test_unreal_manifest_export.py'
      - 'schemas/world-*.schema.json'
      - 'memo-os/WORLD_ENGINE_INTEGRATION_PATCH_V1.md'
      - 'living-novel/os/WORLD_ENGINE_INTEGRATION_PATCH_V1.md'
      - 'living-novel/os/geography/**'
      - 'living-novel/os/engine/novel_os.py'
      - 'living-novel/world/**'
      - '.github/workflows/world-engine-qa.yml'
  push:
    branches:
      - main
      - 'world/**'
    paths:
      - 'world/**'
      - 'tests/test_unreal_manifest_export.py'
      - 'schemas/world-*.schema.json'
      - 'living-novel/os/geography/**'
      - 'living-novel/os/engine/novel_os.py'
      - 'living-novel/world/**'

jobs:
  topology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test committed Unreal preview manifest
        run: python -m unittest discover -s tests -p test_unreal_manifest_export.py -v
      - name: Run spatial topology tests
        run: node world/qa/spatial/spatial_topology_test.js
      - name: Validate JSON files
        run: |
          node -e "for (const f of require('fs').readdirSync('schemas').filter(x=>x.startsWith('world-')&&x.endsWith('.json'))) JSON.parse(require('fs').readFileSync('schemas/'+f,'utf8'));"
          node -e "for (const f of require('fs').readdirSync('world/data').filter(x=>x.endsWith('.json'))) JSON.parse(require('fs').readFileSync('world/data/'+f,'utf8'));"
          node -e "JSON.parse(require('fs').readFileSync('world/qa/spatial/spatial_topology_fixture.json','utf8'));"
          node -e "JSON.parse(require('fs').readFileSync('living-novel/os/geography/world_travel_graph_v1.json','utf8'));"
