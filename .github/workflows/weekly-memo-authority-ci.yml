name: Weekly Memo Authority CI

on:
  pull_request:
    paths:
      - 'PROJECT_CONTROL_REGISTRY.md'
      - 'memo-os/**'
      - 'tests/test_week5_*.py'
      - 'tests/test_commissioner_20261012_character_bindings.py'
      - 'governance/publication-manifest/**'
      - '.github/workflows/weekly-memo-authority-ci.yml'
  push:
    branches: [main]
    paths:
      - 'PROJECT_CONTROL_REGISTRY.md'
      - 'memo-os/**'
      - 'governance/publication-manifest/**'

jobs:
  memo-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce V5.2-RC collaboration regression fixtures (COLLAB-001..012)
        run: python -m unittest discover -s memo-os/tests -p 'test_v52*.py' -v
      - name: Validate unit-stills Page Design Packet routing
        run: python -m unittest discover -s memo-os/tests -p 'test_frank_masi_packet_routing.py' -v
      - name: Validate cinematic scene-direction preflight
        run: python -m unittest discover -s memo-os/tests -p 'test_scene_direction.py' -v
      - name: Preserve Week9 Founder context and storyboard continuation
        run: python -m unittest discover -s memo-os/tests -p 'test_week9_thread_continuity.py' -v
      - name: Apply current Week9 character authority to page inputs
        run: python -m unittest discover -s memo-os/tests -p 'test_week9_character_application.py' -v
      - name: Verify Week9 page-copy coverage and nonfinal boundaries
        run: python -m unittest discover -s memo-os/tests -p 'test_week9_editorial_copy.py' -v
      - name: Validate Week9 no-loss convergence and generation order
        run: python -m unittest discover -s memo-os/tests -p 'test_week9_convergence.py' -v
      - name: Verify Week9 offline result proposals and isolated page inputs
        run: python -m unittest discover -s memo-os/tests -p 'test_week9_production_inputs.py' -v
      - name: Verify Week9 repaired consumers, geometry, sources and approval phases
        run: python -m unittest discover -s memo-os/tests -p 'test_week9_packet_repairs.py' -v
      - name: Verify Week9 provider-final approval folios without enabling PNGs
        run: python -m unittest discover -s memo-os/tests -p 'test_week9_final_approval_folios.py' -v
      - name: Preserve canonical aliases in approval-edition reader copy
        run: python -m unittest discover -s memo-os/tests -p 'test_week9_approval_wording.py' -v
      - name: Verify Week9 new-thread PNG inputs and current source routing
        run: python -m unittest discover -s memo-os/tests -p 'test_week9_png_thread_handoff.py' -v
      - name: Validate publication manifest
        run: python governance/publication-manifest/validate_publication_manifest.py
      - name: Test deterministic Memo resolver
        run: python governance/publication-manifest/test_memo_reference_resolver.py
      - name: Test Week 5 individual page staging
        run: python tests/test_week5_individual_page_staging.py
      - name: Test Week 5 artwork-first image delivery contract
        run: python tests/test_week5_artwork_first_output_contract.py
      - name: Test Week 5 render gateway rejects unverified requests
        run: python tests/test_week5_production_gateway.py
      - name: Install raster regression test runner
        run: python -m pip install pytest
      - name: Test actual Week 5 post-render PNG rejection cases
        run: python -m pytest -q tests/test_week5_raster_acceptance.py tests/test_week5_current_reference_authority.py tests/test_commissioner_20261012_character_bindings.py
