name: ESPN League Snapshot
on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches:
      - main
    paths:
      - "data-gateway/**"
      - "tests/test_data_gateway_snapshot_contract.py"
      - "tests/test_data_gateway_snapshot_persistence.py"
      - ".github/workflows/espn-cold-standby.yml"
permissions:
  contents: write
concurrency:
  group: espn-league-1417621
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hydrate last-known-good snapshot
        run: |
          git fetch origin +refs/heads/data/live:refs/heads/data/live
          SNAPSHOT_PATH="data/snapshots/1417621"
          if git cat-file -e "data/live:$SNAPSHOT_PATH/latest.json" 2>/dev/null; then
            mkdir -p "$SNAPSHOT_PATH"
            git show "data/live:$SNAPSHOT_PATH/latest.json" > "$SNAPSHOT_PATH/latest.json"
            if git cat-file -e "data/live:$SNAPSHOT_PATH/manifest.json" 2>/dev/null; then
              git show "data/live:$SNAPSHOT_PATH/manifest.json" > "$SNAPSHOT_PATH/manifest.json"
            fi
          fi
      - name: Fetch and validate ESPN snapshot
        id: refresh
        continue-on-error: true
        env:
          LEAGUE_ID: "1417621"
          SEASON: "2026"
        run: python data-gateway/refresh_espn_snapshot.py
      - name: Persist and verify snapshot state on data/live
        if: always()
        env:
          LEAGUE_ID: "1417621"
          SCHEMIN_DATA_BRANCH: "data/live"
        run: bash data-gateway/persist_snapshot_to_data_live.sh
      - name: Enforce refresh result
        if: steps.refresh.outcome != 'success'
        run: exit 1
