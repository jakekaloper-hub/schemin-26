name: ESPN League Snapshot
on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
permissions:
  contents: write
concurrency:
  group: espn-league-1417621
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and validate ESPN snapshot
        env:
          LEAGUE_ID: "1417621"
          SEASON: "2026"
        run: python data-gateway/refresh_espn_snapshot.py
      - name: Commit changed snapshot
        run: |
          git add data/snapshots/1417621
          if git diff --cached --quiet -- data/snapshots/1417621; then exit 0; fi
          git config user.name "schemin-data-gateway"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "data: refresh ESPN 1417621 snapshot"
          git push
