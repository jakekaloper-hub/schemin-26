name: Character Control Plane v2 CI
on:
  push:
    paths:
      - 'canon/character-control-plane-v2/**'
      - '.github/workflows/character-control-plane-v2.yml'
  pull_request:
    paths:
      - 'canon/character-control-plane-v2/**'
jobs:
  ccp-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m compileall canon/character-control-plane-v2
      - name: Unit and contract tests
        working-directory: canon/character-control-plane-v2
        run: python -m unittest discover -s tests -v
      - name: Shadow reconciliation
        working-directory: canon/character-control-plane-v2
        run: python shadow_run.py
