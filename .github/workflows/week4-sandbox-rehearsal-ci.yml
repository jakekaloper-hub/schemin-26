name: Week 4 Sandbox Rehearsal CI

on:
  pull_request:
    paths:
      - 'sandbox/week4-rehearsal/**'
      - 'governance/publication/week4_*.py'
      - 'memo-os/week-4/publication-readiness/**'
  workflow_dispatch:

jobs:
  rehearsal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run isolated Week 4 rehearsal
        run: python -m unittest sandbox/week4-rehearsal/test_rehearsal.py
