name: Render Adapter Research Candidate CI

on:
  pull_request:
    paths:
      - "planning/render-adapter/**"
      - "tests/test_render_adapter_candidate.py"
      - ".github/workflows/render-adapter-research-ci.yml"
  workflow_dispatch:

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run render adapter candidate tests
        run: python -m unittest tests/test_render_adapter_candidate.py
