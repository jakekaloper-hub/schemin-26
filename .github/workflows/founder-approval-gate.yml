name: Founder Approval Gate CI
on:
  pull_request:
    paths:
      - 'governance/publication/founder_approval_gate.py'
      - 'governance/publication/test_founder_approval_gate.py'
      - 'governance/publication/founder_approval_runtime.py'
      - 'governance/publication/test_founder_approval_runtime.py'
      - '.github/workflows/founder-approval-gate.yml'
  push:
    paths:
      - 'governance/publication/founder_approval_gate.py'
      - 'governance/publication/test_founder_approval_gate.py'
      - 'governance/publication/founder_approval_runtime.py'
      - 'governance/publication/test_founder_approval_runtime.py'
      - '.github/workflows/founder-approval-gate.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Founder approval and runtime regression
        run: python -m unittest discover -s governance/publication -p 'test_founder_approval_*.py' -v
