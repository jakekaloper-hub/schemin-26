name: Repository Visibility Ledger

on:
  pull_request:
    paths:
      - 'governance/repository-health/**'
      - '.github/workflows/repository-visibility.yml'
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: schemin-repository-visibility-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test repository inventory semantics
        run: python -m unittest discover -s governance/repository-health -p 'test_*.py' -v

  refresh-ledger:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: verify
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh complete GitHub branch and PR inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: python governance/repository-health/visibility.py --repo "$GITHUB_REPOSITORY"
      - name: Commit only derived status ledger to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- governance/repository-health/BRANCH_VISIBILITY_LEDGER.md
          if ! git diff --cached --quiet; then
            git commit -m 'chore(governance): refresh repository visibility ledger [skip ci]'
            git push origin HEAD:main
          fi
