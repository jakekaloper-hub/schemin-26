name: Repository Visibility Ledger

on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: schemin-repository-visibility-main
  cancel-in-progress: false

jobs:
  refresh-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests (no network)
        run: python -m unittest discover -s governance/repository-health -p 'test_*.py' -v
      - name: Refresh complete GitHub branch and PR inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: python governance/repository-health/visibility.py --repo "$GITHUB_REPOSITORY"
      - name: Commit only derived status ledger to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- governance/repository-health/BRANCH_VISIBILITY_LEDGER.md
          if ! git diff --cached --quiet; then
            git commit -m 'chore(governance): refresh repository visibility ledger [skip ci]'
            git push origin HEAD:main
          fi
