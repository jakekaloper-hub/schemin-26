name: Bullpen Runtime CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bullpen-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test video ingestion evidence isolation
        working-directory: .
        run: python -m unittest discover -s tests -p test_video_intelligence_217.py -v
