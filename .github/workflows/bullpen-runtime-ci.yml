name: Bullpen Runtime CI
on:
  push:
    paths:
      - "bullpen-runtime/**"
      - ".github/workflows/bullpen-runtime-ci.yml"
  pull_request:
    paths:
      - "bullpen-runtime/**"
      - ".github/workflows/bullpen-runtime-ci.yml"
  workflow_dispatch:
concurrency:
  group: bullpen-runtime-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bullpen-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
