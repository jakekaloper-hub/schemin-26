name: Commonwealth Folio Studio — source and nonpromotion gates
on:
  pull_request:
    paths:
      - "world/environment-references/cinematic-folio/**"
      - "world/environment-references/plates/**"
      - "world/location-control-plane/registries/LOCATION_REFERENCE_REGISTRY.json"
      - "world/location-control-plane/locations/**"
      - "world/data/locations.json"
      - "world/data/divisions.json"
      - "world/data/owner_domains.json"
      - "world/data/routes.json"
      - "world/data/physical_zones.json"
      - "world/data/atlas_location_candidates.json"
      - "world/data/current_world_state.json"
      - "world/data/world_state_events.json"
  workflow_dispatch:
jobs:
  offline-folio:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Reproduce derived source data and pre-existing approved SVG bytes
        run: python3 world/environment-references/cinematic-folio/build_folio.py --check
      - name: Run source, branch-authority and image-nonpromotion regression tests
        run: python3 -m unittest discover -s world/environment-references/cinematic-folio/tests -p 'test_*.py' -v
      - name: Validate browser JavaScript syntax
        run: node --check world/environment-references/cinematic-folio/site/app.js
      - name: Test actual browser navigation, source links, Island years and mobile layout
        run: |
          set -eu
          python3 -m http.server 8893 --bind 127.0.0.1 --directory world/environment-references/cinematic-folio/site >/tmp/folio-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --version
          READY=0
          for boot in 1 2; do
            "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu \
              --no-first-run --no-default-browser-check --disable-extensions \
              --remote-debugging-address=127.0.0.1 --remote-debugging-port=9229 \
              '--remote-allow-origins=*' --user-data-dir="/tmp/folio-chrome-qa-$boot" \
              about:blank >"/tmp/folio-chrome-$boot.log" 2>&1 &
            CHROME_PID=$!
            trap 'kill "$SERVER_PID" "$CHROME_PID" 2>/dev/null || true' EXIT
            for attempt in $(seq 1 12); do
              if curl --max-time 1 -fsS http://127.0.0.1:9229/json/version >/dev/null 2>&1; then
                READY=1
                break
              fi
              if ! kill -0 "$CHROME_PID" 2>/dev/null; then break; fi
              sleep 1
            done
            if [ "$READY" -eq 1 ]; then break; fi
            echo "::warning::Chrome CDP startup failed on attempt $boot"
            tail -80 "/tmp/folio-chrome-$boot.log" || true
            kill "$CHROME_PID" 2>/dev/null || true
          done
          if [ "$READY" -ne 1 ]; then
            echo "::error::Hosted Chrome could not expose its CDP port after two attempts."
            exit 1
          fi
          curl --max-time 5 -fsS http://127.0.0.1:8893/data/world.json >/dev/null
          FOLIO_DEVTOOLS_HTTP=http://127.0.0.1:9229 FOLIO_LOCAL_URL=http://127.0.0.1:8893/index.html \
            timeout 90s node world/environment-references/cinematic-folio/tests/browser_smoke.mjs
      - name: Assert no generated cinematic raster files were committed
        run: |
          if find world/environment-references/cinematic-folio -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.webp' \) | grep -q .; then
            echo "::error::Code-only Folio branch contains generated raster imagery"
            exit 1
          fi
          echo "PASS — code-only assets, no generated PNG/JPEG/WebP"
