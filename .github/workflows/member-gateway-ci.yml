name: Member AI Gateway Phase 1 CI

on:
  push:
    branches: [feat/member-ai-gateway-phase1]
  pull_request:

jobs:
  phase1-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: pytest -q tests/test_member_gateway_phase1.py
