name: Character Reference Binary Integrity
on:
  pull_request:
    paths:
      - 'canon/characters/runtime/verified_reference_transport.py'
      - 'canon/characters/APPROVED_LINEUP_2026_10_18.json'
      - 'canon/characters/assets/lineups/**'
      - 'tests/test_verified_reference_transport.py'
      - 'tests/test_approved_lineup_binary_integrity.py'
      - '.github/workflows/character-reference-binary-integrity.yml'
  workflow_dispatch:
jobs:
  verify-lineup-bytes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify synthetic guardrails and actual 12 PNG crops
        run: python -m unittest discover -s tests -p 'test_verified_reference_transport.py' && python -m unittest discover -s tests -p 'test_approved_lineup_binary_integrity.py'
