name: Week 11 Memo Source and Creative Intake Gate

on:
  pull_request:
    paths:
      - 'memo-os/week-11/**'
      - 'memo-os/week-9/WEEK_9_WEEK_10_PROVIDER_EVIDENCE_2026-11-20.json'
      - '.github/workflows/memo-week11-source-gate.yml'
  push:
    branches: [main]
    paths:
      - 'memo-os/week-11/**'
      - 'memo-os/week-9/WEEK_9_WEEK_10_PROVIDER_EVIDENCE_2026-11-20.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-intake-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source-pinned Founder and ESPN positive validation
        run: python3 memo-os/week-11/validate_creative_intake.py
      - name: Must reject corrupted Founder, player-score and House inputs
        run: python3 -m unittest discover -s memo-os/week-11 -p 'test_validate_creative_intake.py' -v
      - name: Run Week 11 Atlas route and venue identity preflight
        run: python3 memo-os/week-11/validate_atlas_routes.py
