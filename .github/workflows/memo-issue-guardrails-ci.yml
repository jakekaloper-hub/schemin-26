name: Memo Issue Guardrail Regression
on:
  pull_request:
    paths:
      - 'memo-os/tests/validate_issue.py'
      - 'memo-os/tests/test_validate_issue.py'
      - '.github/workflows/memo-issue-guardrails-ci.yml'
  push:
    branches: [main]
    paths:
      - 'memo-os/tests/validate_issue.py'
      - 'memo-os/tests/test_validate_issue.py'
      - '.github/workflows/memo-issue-guardrails-ci.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run issue manifest regression suite
        working-directory: memo-os/tests
        run: python -m unittest -v test_validate_issue.py
