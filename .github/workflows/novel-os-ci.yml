name: Novel OS CI
on:
  push:
    paths:
      - "living-novel/os/**"
      - "living-novel/migrations/**"
      - "living-novel/whole-book/**"
      - "living-novel/consultants/**"
      - "living-novel/production/historical-saga/approved-mission-2015-2026/**"
      - "living-novel/historical-chronicle/**"
      - "canon/SCHEMIN_26_MASTER_CHARACTER_CANON.md"
      - "chronicles/proof-of-concept/prologue/**"
      - ".github/workflows/novel-os-ci.yml"
  pull_request:
    paths:
      - "living-novel/os/**"
      - "living-novel/migrations/**"
      - "living-novel/whole-book/**"
      - "living-novel/consultants/**"
      - "living-novel/production/historical-saga/approved-mission-2015-2026/**"
      - "living-novel/historical-chronicle/**"
      - "canon/SCHEMIN_26_MASTER_CHARACTER_CANON.md"
      - "chronicles/proof-of-concept/prologue/**"
      - ".github/workflows/novel-os-ci.yml"
  workflow_dispatch:
jobs:
  novel-os-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Novel OS
        run: python -m py_compile living-novel/os/engine/novel_os.py
      - name: Validate Frank Masi unit-stills adapter contract
        run: python -m unittest discover -s living-novel/os/adapters -p 'test_*unit_stills*.py' -v
      - name: Run deterministic and adversarial suite
        working-directory: living-novel/os/evaluations
        run: python -m unittest -v test_novel_os.py
      - name: Validate Novel external advisor registry
        run: python living-novel/consultants/test_advisor_registry.py
      - name: Validate Author Council deterministic routing
        run: python living-novel/consultants/author-council/test_author_router.py
      - name: Validate causal chapter architecture
        run: python living-novel/os/evaluations/test_causal_chapter_architecture.py
      - name: Validate Author Council book architecture
        run: python living-novel/os/evaluations/test_author_council_book_architecture.py
      - name: Validate POV packet firewall
        run: python living-novel/os/evaluations/test_pov_packet_validator.py
      - name: Validate Author Council engagement 001
        run: python living-novel/consultants/author-council/test_engagement_001.py
      - name: Validate Chapter III minimum pre-prose gate
        run: python living-novel/os/evaluations/test_chapter_03_minimum_gate.py
      - name: Validate Chapter III mission closeout
        run: python living-novel/os/evaluations/test_chapter_03_mission.py
      - name: Validate Chapter III Founder canon closeout
        run: python living-novel/os/evaluations/test_chapter_03_canon_closeout.py
      - name: Test Twelve POV migration validator
        run: python -m unittest discover -s living-novel/migrations -p "test_*.py" -v
      - name: Validate whole-book convergence
        run: python living-novel/os/evaluations/test_whole_book_convergence.py
      - name: Validate 2025 historical Pitts eight-scene candidate (noncanon)
        run: python -m unittest discover -s living-novel/production/historical-saga/approved-mission-2015-2026/review -p "test_2025_reckoning_v2.py" -v
      - name: Validate 2025 historical Duckhook nine-scene collection V3 (noncanon)
