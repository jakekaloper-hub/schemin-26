name: Data Gateway CI
on:
  push:
    paths:
      - "data-gateway/**"
      - "schemas/freshness.schema.json"
      - "tests/test_data_gateway_snapshot_contract.py"
      - "tests/test_data_gateway_snapshot_persistence.py"
      - ".github/workflows/espn-cold-standby.yml"
      - ".github/workflows/data-gateway-ci.yml"
  pull_request:
    paths:
      - "data-gateway/**"
      - "schemas/freshness.schema.json"
      - "tests/test_data_gateway_snapshot_contract.py"
      - "tests/test_data_gateway_snapshot_persistence.py"
      - ".github/workflows/espn-cold-standby.yml"
      - ".github/workflows/data-gateway-ci.yml"
  workflow_dispatch:
concurrency:
  group: data-gateway-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  snapshot-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile gateway
        run: python -m py_compile data-gateway/refresh_espn_snapshot.py data-gateway/check_snapshot_health.py
      - name: Validate persistence shell
        run: bash -n data-gateway/persist_snapshot_to_data_live.sh
      - name: Run snapshot contract tests
        run: python -m unittest -v tests/test_data_gateway_snapshot_contract.py tests/test_data_gateway_snapshot_persistence.py
