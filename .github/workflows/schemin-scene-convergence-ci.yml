name: Schemin Cross-OS Scene Convergence

on:
  pull_request:
    paths:
      - "governance/cross-os/**"
      - ".github/workflows/schemin-scene-convergence-ci.yml"
  push:
    branches: [main]
    paths:
      - "governance/cross-os/**"
      - ".github/workflows/schemin-scene-convergence-ci.yml"
  workflow_dispatch:

jobs:
  scene-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate shared authority and consumer map
        run: python governance/cross-os/validate_scene_convergence.py
      - name: Verify adapter hydration fails closed\n        run: python -m unittest discover -s governance/cross-os -p "test_scene_hydration.py" -v\n      - name: Detect consumer drift and source forks
        run: python -m unittest discover -s governance/cross-os -p "test_*.py" -v
