name: Week 7 Intake Diagnostics
on:
  pull_request:
    paths:
      - 'memo-os/week-7/**'
      - '.github/workflows/week7-intake-diagnostics.yml'
  push:
    branches: [main]
    paths:
      - 'memo-os/week-7/**'
      - '.github/workflows/week7-intake-diagnostics.yml'
permissions:
  contents: read
jobs:
  transaction-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s memo-os/week-7 -p 'test_compare_transaction_snapshots.py' -v
