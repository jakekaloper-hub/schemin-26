name: Operational Convergence Drift Inventory
on:
  pull_request:
    paths:
      - "skills/schemin-pdf-bytes/**"
      - "governance/execution-control/pr_reconciliation.py"
      - "governance/execution-control/test_pr_reconciliation.py"
      - "living-novel/os/qa/check_execution_drift.py"
      - "living-novel/os/qa/test_execution_drift.py"
      - "living-novel/whole-book/_INDEX.md"
      - "governance/execution-control/TASK_REGISTRY_V1.json"
      - ".github/workflows/operational-convergence-inventory.yml"
  workflow_dispatch:
  schedule:
    - cron: '23 12 * * *'
permissions:
  contents: read
  pull-requests: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test PDF byte recovery skill
        run: python -m unittest discover -s skills/schemin-pdf-bytes/tests -p 'test_*.py' -v
      - name: Test read-only inventory classification
        run: python -m unittest -v governance/execution-control/test_pr_reconciliation.py
      - name: Test read-only Novel state discrepancy detector
        run: python -m unittest discover -s living-novel/os/qa -p 'test_execution_drift.py' -v
      - name: Report Novel and Execution Control drift (advisory; no state change)
        run: |
          python living-novel/os/qa/check_execution_drift.py > /tmp/novel-execution-drift.json
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open('/tmp/novel-execution-drift.json'))
          print('## Novel / Execution Control discrepancy scan (advisory only)')
          print('- Status:', d['status'])
          print('- Review findings:', len(d.get('findings',[])))
          for f in d.get('findings',[]):
              print('- {}: {} (source: {})'.format(f['task'],f['result'],f.get('source','unavailable')))
          print('- No task, fact, canon, or publication state changed')
          PY
      - name: Query GitHub and record disposition candidates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python governance/execution-control/pr_reconciliation.py --output /tmp/operational-pr-inventory.json
          echo '## Operational PR inventory (metadata-only; no merge certification)' >> "$GITHUB_STEP_SUMMARY"
          python -c "import json; d=json.load(open('/tmp/operational-pr-inventory.json')); print('\n'.join(f'- {k}: {v}' for k,v in d['counts'].items()))" >> "$GITHUB_STEP_SUMMARY"
          python -c "import json; b=json.load(open('/tmp/operational-pr-inventory.json'))['branch_visibility']; print('- Remote branch refs: {}'.format(b['branch_count'])); print('- Refs not heads/bases of open PRs: {}'.format(b['without_open_pr_head_or_base_count'])); print('- Untracked refs are not proof of unique unmerged commits or readiness')" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: operational-pr-inventory
          path: |
            /tmp/operational-pr-inventory.json
            /tmp/novel-execution-drift.json
          retention-days: 30
