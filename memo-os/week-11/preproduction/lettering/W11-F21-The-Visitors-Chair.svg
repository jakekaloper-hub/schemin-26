  <text x="18" y="509" class="cue">Babb keeps his pen. One thumb slips under the face-down sheet.</text>

  <!-- The text panel starts at y=526.933 = 76% of page height. -->
  <rect x="0" y="526.933333" width="390" height="166.4" fill="#f3ecda"/>
  <path d="M18 540H372" stroke="#8c7865" stroke-width=".7"/>
  <g class="serif" fill="#28252a" font-size="17" id="manuscript">
    <text x="18" y="563">“The LLC buys Jackson. You’d still run the place.”</text>
    <text x="18" y="585">David shifted his offer so the groundskeeper could</text>
    <text x="18" y="607">hang up the key. When the door shut, Zach pushed</text>
    <text x="18" y="629">the offer back unsigned. “Jackson stays here.</text>
    <text x="18" y="651">There’s something else you ought to read.”</text>
  </g>
  <path d="M18 666H372" stroke="#9f927d" stroke-width=".65"/>
  <text x="18" y="682" class="label" font-size="8.5" letter-spacing=".55" fill="#655e54">ONE LAST CROSSING</text>
