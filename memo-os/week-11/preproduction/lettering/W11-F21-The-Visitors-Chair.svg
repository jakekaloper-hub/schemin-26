  <title>F21 · The visitor’s chair</title>
  <desc>Lettering and prop-blocking rehearsal at Jackson. Read from Babb’s chair. The groundskeeper returns the brass key and leaves before the unsigned offer comes back. Babb holds his unused pen as his other thumb slips beneath the face-down sheet.</desc>
