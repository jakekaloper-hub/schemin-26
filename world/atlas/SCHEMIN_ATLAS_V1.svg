<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t d">
<title id="t">Schemin Atlas V1 schematic</title>
<desc id="d">Non-literal schematic showing seven physical zones and three League division overlays. Coordinates are diagrammatic, not canonical mileage.</desc>
<rect width="1200" height="800" fill="#efe6cf"/>
<path d="M180 80 L720 70 L900 190 L780 300 L220 290 Z" fill="#c9c1b0" stroke="#333" stroke-width="3"/>
<text x="390" y="160" font-size="34">NORTHERN SPINE</text>
<path d="M170 260 L790 250 L900 390 L690 470 L170 430 Z" fill="#d7cfb5" stroke="#333" stroke-width="3"/>
<text x="350" y="350" font-size="30">UPPER VALLEYS</text>
<path d="M360 420 L850 360 L980 550 L700 650 L360 610 Z" fill="#ddd3ae" stroke="#333" stroke-width="3"/>
<text x="540" y="520" font-size="30">CENTRAL BASIN</text>
