<text x="280" y="225" font-size="42" fill="#8b3a2b">BURGERS</text>
<path d="M80 350 L470 405 L420 690 L90 640 Z" fill="none" stroke="#9a6a20" stroke-width="12" stroke-dasharray="18 12" opacity=".75"/>
<text x="130" y="575" font-size="42" fill="#9a6a20">WINGS</text>
<path d="M480 350 L1110 300 L1130 745 L430 700 Z" fill="none" stroke="#6b3f66" stroke-width="12" stroke-dasharray="18 12" opacity=".75"/>
<text x="760" y="580" font-size="42" fill="#6b3f66">PIZZA</text>
<text x="30" y="790" font-size="18">SCHEMATIC ONLY — relative topology, not canonical scale</text>
