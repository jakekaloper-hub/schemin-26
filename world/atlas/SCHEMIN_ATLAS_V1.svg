<text x="100" y="510" font-size="26">WESTERN TABLELANDS</text>
<path d="M820 250 L1120 330 L1080 620 L900 600 L850 360 Z" fill="#abc0b1" stroke="#333" stroke-width="3"/>
<text x="890" y="450" font-size="25">EASTERN STORM</text>
