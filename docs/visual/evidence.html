<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Commonwealth Evidence Graph</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0e1319;color:#f1e9dc;font:15px/1.55 system-ui}header,main{padding:28px 5%}header{border-bottom:1px solid #4c5965}h1{font:clamp(36px,5vw,60px) Georgia,serif;margin:7px 0}h2{font:26px Georgia,serif}a{color:#e2c28e}p{color:#bfc8d0}.notice{border-left:3px solid #dfb97d;padding:12px 18px;background:#2d281f}.toolbar{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0}input,select{background:#1a2732;color:white;padding:10px;border:1px solid #667785;border-radius:5px;font:inherit}.layout{display:grid;grid-template-columns:1fr 1fr;gap:20px}.list{max-height:70vh;overflow:auto}.node{width:100%;text-align:left;background:#1d2935;border:1px solid #455968;color:#f0e9dc;padding:12px;margin-bottom:7px;cursor:pointer;border-radius:6px}.node.active{border:2px solid #e4c38b}.type{font-size:11px;color:#e4c38b}.detail{background:#1c2732;border:1px solid #51616f;border-radius:9px;padding:22px;align-self:start}.edge{background:#26333e;padding:10px;margin:8px 0;border-left:2px solid #d4b47b}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ffd88c}@media(max-width:750px){.layout{grid-template-columns:1fr}.list{max-height:400px}}</style></head><body><header><small>COMMONWEALTH INTELLIGENCE / EXPLICIT PROVENANCE</small><h1>Historical Evidence Graph</h1><p>Explore recorded connections among events, canonical locations, characters, and publication identities.</p><a href="history.html">Historical Explorer</a> · <a href="atlas.html">Atlas</a> · <a href="index.html">Command Center</a></header><main><p class="notice" id="notice">Loading...</p><div class="toolbar"><input id="search" type="search" placeholder="Search IDs, locations, publications"><select id="type"><option value="all">All record types</option></select></div><p id="summary" role="status"></p><div class="layout"><section id="nodes" class="list" aria-label="Evidence records"></section><aside id="detail" class="detail" aria-live="polite"><h2>Select a record</h2></aside></div></main><script>
const qs=x=>document.querySelector(x),make=(t,v)=>{const e=document.createElement(t);e.textContent=v;return e};let data,selected;
function render(){const host=qs('#nodes');host.replaceChildren();const q=qs('#search').value.toLowerCase(),t=qs('#type').value;let a=data.nodes.filter(n=>(t==='all'||n.type===t)&&(n.title+' '+n.id).toLowerCase().includes(q));qs('#summary').textContent=a.length+' of '+data.nodes.length+' nodes · '+data.edges.length+' explicit relationships';for(const n of a){const b=make('button',n.title+' — '+n.type);b.className='node'+(selected===n.id?' active':'');b.addEventListener('click',()=>show(n));host.append(b)}}
function show(n){selected=n.id;const h=qs('#detail');h.replaceChildren(make('h2',n.title),make('p','ID: '+n.id),make('p','Type: '+n.type),make('p','Recorded state: '+(n.status||'not specified')));const a=make('a','Inspect source');a.href='../../'+n.source;h.append(a,make('h3','Explicit relationships'));const related=data.edges.filter(x=>x.from===n.id||x.to===n.id);for(const e of related){const other=data.nodes.find(x=>x.id===(e.from===n.id?e.to:e.from));const box=make('div',e.relation+' — '+(other?.title||'unknown'));box.className='edge';const link=make('a','Source');link.href='../../'+e.source;box.append(' ',link);h.append(box)}if(!related.length)h.append(make('p','No explicit edges in current source index.'));if(n.type==='event')h.append(make('p','Event-to-specific league facts, Memo pages, and Novel passages remain unproven; no causal edges were generated.'));render()}
fetch('./evidence-graph.json').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{data=d;qs('#notice').textContent=d.warning;for(const t of [...new Set(d.nodes.map(x=>x.type))].sort()){const o=make('option',t);o.value=t;qs('#type').append(o)}render();if(d.nodes.length)show(d.nodes.find(n=>n.type==='event')||d.nodes[0])}).catch(e=>qs('#notice').textContent='Source unavailable: '+e.message);qs('#search').addEventListener('input',()=>data&&render());qs('#type').addEventListener('change',()=>data&&render());
</script></body></html>
