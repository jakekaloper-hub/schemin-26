<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Commonwealth Publication History</title><style>:root{color-scheme:dark}body{background:#0e1217;color:#f4eddc;font:15px/1.5 system-ui;margin:0}header,main{padding:26px 6%}header{border-bottom:1px solid #47535a}h1{font:clamp(34px,5vw,60px) Georgia,serif;margin:8px 0}h2{font:24px Georgia,serif}a{color:#e2c18b}.notice{border-left:3px solid #deb57c;padding:12px;background:#29271f}.controls{display:flex;gap:15px;flex-wrap:wrap;padding:25px 0}select{background:#1b2730;color:white;padding:12px;border:1px solid #61727b}.entry{display:grid;grid-template-columns:140px 1fr;gap:24px;margin:0 0 18px}.when{text-align:right;color:#dec591;padding:17px 0}.item{border-left:3px solid #9c8258;background:#19212a;border-radius:0 9px 9px 0;padding:16px 20px}.state{font-size:12px;border:1px solid #997f58;padding:3px 7px;border-radius:15px}.meta{font-size:12px;color:#c2c9cd}.empty{color:#c2c9cd}@media(max-width:640px){.entry{grid-template-columns:1fr;gap:4px}.when{text-align:left;padding:0}}</style></head><body><header><div>COMMONWEALTH ARCHIVE · DERIVED PUBLICATION INDEX</div><h1>Publication Chronology</h1><p>Released issues and in-progress publication identities are distinguished. The derived manifest does not itself authorize release.</p><a href="index.html">Return to Command Center</a></header><main><p class="notice" id="warning"></p><div class="controls"><label>Publication family <select id="family"><option value="all">All families</option></select></label><label>Release state <select id="state"><option value="all">All recorded states</option></select></label></div><p id="count" role="status"></p><div id="entries"></div></main><script>
let publications=[];const wrap=document.querySelector('#entries'),family=document.querySelector('#family'),state=document.querySelector('#state');
function elt(t,txt){const e=document.createElement(t);e.textContent=txt;return e}
function draw(){wrap.replaceChildren();const rows=publications.filter(p=>(family.value==='all'||p.family===family.value)&&(state.value==='all'||p.release_state===state.value)).sort((a,b)=>String(a.publication_date||'').localeCompare(String(b.publication_date||''))||a.publication_id.localeCompare(b.publication_id));document.querySelector('#count').textContent=rows.length+' publication identities';for(const p of rows){const card=elt('article','');card.className='entry';const when=elt('div',p.publication_date||'Date unverified');when.className='when';const item=elt('div','');item.className='item';item.append(elt('h2',p.title||p.publication_id));const s=elt('span',p.release_state||'Unknown status');s.className='state';item.append(s,elt('p',p.family+' • '+p.publication_id),elt('p','Artifact: '+(p.canonical_artifact||'Not specified')));for(const ref of (p.release_receipt_refs||[]).slice(0,3)){const a=elt('a','Release receipt');a.href='../../'+ref;item.append(a,elt('span',' '))}card.append(when,item);wrap.append(card)}}
fetch('./publications-data.json').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{publications=d.publications;document.querySelector('#warning').textContent=d.authority_warning;for(const [s,vals] of [[family,new Set(publications.map(p=>p.family))],[state,new Set(publications.map(p=>p.release_state))]])for(const v of [...vals].sort()){const o=elt('option',v||'Unknown');o.value=v;s.append(o)}draw()}).catch(e=>document.querySelector('#count').textContent='Source not available: '+e.message);
family.addEventListener('change',draw);state.addEventListener('change',draw);
</script></body></html>
