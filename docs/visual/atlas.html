<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Commonwealth Atlas — Schemin ’26</title><style>
:root{color-scheme:dark;--bg:#0d1217;--panel:#1c252b;--ink:#f0e8d7;--dim:#c1c1b8;--gold:#dec08a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui}header{padding:24px 4%;border-bottom:1px solid #4e5559}h1{font:clamp(32px,4vw,55px) Georgia,serif;margin:5px 0}h2{font:25px Georgia,serif}a{color:var(--gold)}main{display:grid;grid-template-columns:minmax(400px,2fr) minmax(290px,1fr);gap:15px;padding:20px 3%}svg{width:100%;height:auto;min-height:480px;border:1px solid #56605c;border-radius:9px;background:radial-gradient(ellipse at 53% 50%,#273d3e,#121d25 77%)}aside{background:var(--panel);border:1px solid #48575d;border-radius:9px;padding:20px;align-self:start}p{color:var(--dim)}.options{display:flex;gap:14px;flex-wrap:wrap;margin:13px 0}.options label{cursor:pointer}.route{stroke:#b1b5a2;stroke-width:1.3;opacity:.5;stroke-dasharray:5 4}.route.selected{stroke:#fff0be;stroke-width:3;opacity:1}.loc{cursor:pointer}.loc circle{fill:#c4a66e;stroke:#17202a;stroke-width:2}.loc text{fill:#f6efe0;font-size:2.7px;pointer-events:none}.loc.selected circle{fill:#f6edd1;stroke:#be8242;stroke-width:2.5}button{background:#2d3d42;border:1px solid #9d936e;color:var(--ink);border-radius:5px;padding:6px 9px;cursor:pointer}input{background:#1a242b;color:white;border:1px solid #728087;padding:8px}button:focus-visible,input:focus-visible{outline:3px solid #ffcf7c}small{color:var(--dim)}@media(max-width:850px){main{grid-template-columns:1fr}svg{min-height:310px}}</style></head><body>
<header><small>WORLD ENGINE • SOURCE-BOUND SCHEMATIC</small><h1>Commonwealth Atlas</h1><p>Canon-derived locations, routes and remembered events. Positions are abstract, not metric geography.</p><a href="index.html">Return to Command Center</a></header>
<main><div><div class="options"><label><input id="routes" type="checkbox" checked> Routes</label><label><input id="labels" type="checkbox" checked> Labels</label><label><input id="events" type="checkbox" checked> Event markers</label><label for="search">Find location <input id="search" type="search" placeholder="Name or ID"></label></div><svg id="atlas" viewBox="0 0 110 110" role="img" aria-label="Schematic map of canonical Commonwealth locations and routes"></svg><p id="status" role="status"></p><small>Source: <a href="../../world/data/locations.json">locations</a> · <a href="../../world/data/routes.json">routes</a> · <a href="../../world/data/world_state_events.json">events</a> · <a href="../../world/data/current_world_state.json">state</a></small></div><aside id="detail" aria-live="polite"><h2>World evidence</h2><p>Select a location to inspect events and continuity.</p></aside></main>
<script>
const NS='http://www.w3.org/2000/svg',svg=document.querySelector('#atlas'),details=document.querySelector('#detail'),status=document.querySelector('#status');let data=null,selected=null;
function node(tag,attrs,parent=svg){const e=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);parent.append(e);return e}
function item(tag,value){const e=document.createElement(tag);e.textContent=value;return e}
function inspect(loc){selected=loc.id;details.replaceChildren(item('h2',loc.name),item('p',loc.id),item('p','Canon: '+(loc.canon_status||'not stated')),item('p','Zone: '+(loc.zone||'not stated')),item('p','Division: '+(loc.division||'not stated')),item('p','State snapshot: '+data.state_as_of));const history=data.events.filter(e=>e.location_id===loc.id);details.append(item('h3','Recorded events ('+history.length+')'));if(!history.length)details.append(item('p','No events recorded in this source ledger.'));for(const e of history){details.append(item('p','Week '+e.week+' · '+e.classification+' · '+e.type+' — '+e.continuity_out.join('; ')))}details.append(item('h3','Current state'));details.append(item('p',loc.current_state.length?loc.current_state.join('; '):'No location-specific state in this snapshot.'));draw()}
function draw(){if(!data)return;svg.replaceChildren();const byId=new Map(data.locations.map(x=>[x.id,x]));if(document.querySelector('#routes').checked)for(const r of data.routes){const a=byId.get(r.from),b=byId.get(r.to);const line=node('line',{x1:a.position[0],y1:a.position[1],x2:b.position[0],y2:b.position[1],class:'route'+(selected&&(r.from===selected||r.to===selected)?' selected':'')});const t=node('title',{},line);t.textContent=r.name+' ('+r.canon_status+')'}for(const loc of data.locations){const [x,y]=loc.position;const g=node('g',{class:'loc'+(loc.id===selected?' selected':''),role:'button',tabindex:'0','aria-label':loc.name});node('circle',{cx:x,cy:y,r:2.1},g);if(document.querySelector('#events').checked&&data.events.some(e=>e.location_id===loc.id))node('circle',{cx:x+2.3,cy:y-2.3,r:.9,fill:'#e48c64'},g);if(document.querySelector('#labels').checked){const tx=node('text',{x:x+2.7,y:y-1},g);tx.textContent=loc.name.length>19?loc.name.slice(0,18)+'…':loc.name}const title=node('title',{},g);title.textContent=loc.name;g.addEventListener('click',()=>inspect(loc));g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();inspect(loc)}})}}
['routes','labels','events'].forEach(id=>document.getElementById(id).addEventListener('change',draw));document.querySelector('#search').addEventListener('input',e=>{if(!data)return;const q=e.target.value.toLowerCase();const found=data.locations.find(x=>(x.name+' '+x.id).toLowerCase().includes(q));if(q&&found)inspect(found)});
fetch('./atlas-data.json').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(v=>{data=v;status.textContent=v.locations.length+' locations · '+v.routes.length+' routes · '+v.events.length+' events · state '+v.state_as_of;draw()}).catch(e=>status.textContent='Atlas source unavailable: '+e.message);
</script></body></html>
