<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Schemin Story Engine</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0d131a;color:#f1e9d8;font:15px/1.55 system-ui}header{padding:35px 5%;border-bottom:1px solid #4b5960;background:radial-gradient(circle at 90% 0,#423324,transparent 50%)}h1{font:clamp(35px,5vw,65px) Georgia,serif;margin:8px 0}h2{font:28px Georgia,serif}a{color:#e3c28a}p{color:#c4ccd2}main{display:grid;grid-template-columns:3fr 2fr;gap:20px;padding:25px 5%}.flow{display:grid;gap:8px}.step{color:#f2e8d6;background:#1d2934;border:1px solid #50616c;border-radius:9px;padding:14px 20px;text-align:left;cursor:pointer;font:inherit}.step b{font:22px Georgia,serif}.step.active{border:2px solid #e3c28a}.arrow{text-align:center;color:#e3c28a}.details,.evidence{background:#1a2530;border:1px solid #52616c;border-radius:9px;padding:20px}.details{align-self:start;position:sticky;top:20px}.evidence{margin-top:18px}.eyebrow{letter-spacing:.18em;text-transform:uppercase;color:#e3c28a;font-size:11px}button:focus-visible,a:focus-visible{outline:3px solid #ffdd95;outline-offset:3px}@media(max-width:800px){main{grid-template-columns:1fr}.details{position:static}}
</style></head><body><header><div class="eyebrow">Commonwealth Intelligence</div><h1>The Schemin Story Engine</h1><p>How verified fantasy football events become stories in a persistent world. Select a stage to inspect its authority.</p><a href="index.html">Back to Command Center</a></header><main><div><div class="flow" id="flow"></div><div id="evidence" class="evidence" aria-live="polite">Loading evidence...</div></div><aside id="details" class="details" aria-live="polite"><h2>Select a stage</h2></aside></main><script>
const flow=document.querySelector('#flow'),details=document.querySelector('#details'),evidence=document.querySelector('#evidence');
const node=(tag,text)=>{const e=document.createElement(tag);e.textContent=text;return e};
function show(s){document.querySelectorAll('.step').forEach(n=>n.classList.toggle('active',Number(n.dataset.number)===s.number));details.replaceChildren(node('h2',s.title),node('p',s.description),node('p','Authority lane: '+s.lane));const a=node('a','Inspect canonical source');a.href='../../'+s.source;details.append(a,node('p','This stage describes an established workflow contract, not an end-to-end execution receipt.'))}
fetch('./story-engine-data.json').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{d.steps.forEach((s,i)=>{const b=node('button',s.number+'. '+s.title);b.className='step';b.dataset.number=s.number;b.type='button';b.addEventListener('click',()=>show(s));flow.append(b);if(i<d.steps.length-1){const a=node('div','↓');a.className='arrow';flow.append(a)}});show(d.steps[0]);evidence.replaceChildren(node('h2','Recorded evidence'),node('p',d.warning),node('p','World state as of '+d.world_state_as_of));for(const m of d.memos)evidence.append(node('p',m.id+' — '+m.status));evidence.append(node('p',d.events.length+' world events in the current ledger'))}).catch(e=>evidence.textContent='Evidence unavailable: '+e.message);
</script></body></html>
